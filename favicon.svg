<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sun rays -->
  <g stroke="#F5A623" stroke-width="1.8" stroke-linecap="round">
    <line x1="23" y1="7"  x2="24.8" y2="5.2"/>
    <line x1="27" y1="11" x2="29.2" y2="10"/>
    <line x1="28" y1="15" x2="30.5" y2="15"/>
    <line x1="27" y1="19" x2="29.2" y2="20"/>
    <line x1="23" y1="22.5" x2="24.5" y2="24.5"/>
  </g>
  <!-- Sun body -->
  <circle cx="23" cy="15" r="5" fill="#F5A623"/>
  <!-- Cloud shadow -->
  <ellipse cx="14.5" cy="22.5" rx="11" ry="6" fill="rgba(0,0,0,0.08)"/>
  <!-- Cloud -->
  <circle cx="10" cy="20" r="5.5" fill="#E8EEF5"/>
  <circle cx="16" cy="18" r="6.5" fill="#E8EEF5"/>
  <circle cx="21" cy="20.5" r="4.5" fill="#E8EEF5"/>
  <rect x="5" y="20" width="19" height="7" rx="0" fill="#E8EEF5"/>
</svg>
